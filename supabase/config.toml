# ============================================================
# CitasPro — Supabase CLI configuration
# ============================================================
# Para usar este proyecto con Supabase CLI:
#   1. Instala CLI:  brew install supabase/tap/supabase  (macOS)
#                     o https://supabase.com/docs/guides/cli
#   2. Login:         supabase login
#   3. Link al proyecto remoto:
#       supabase link --project-ref <TU_PROJECT_REF>
#       (project-ref aparece en Settings → General del dashboard Supabase)
#   4. Aplicar schema y RLS:
#       supabase db push
# ============================================================

project_id = "citaspro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://citas-medicas.vercel.app/auth/callback"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
template = {}
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }} ."

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
url = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[analytics]
enabled = false
